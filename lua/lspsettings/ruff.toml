line-length = 88

[lint]
# Google docstring convention requires D; ANN is redundant with strict Pyright but cheap and catches at lint time
select = ["E", "F", "B", "SIM", "UP", "I", "D", "ANN", "C4", "RET", "PTH", "T20", "ARG"]

# D211 beats D203, D213 beats D212 - mutually exclusive pydocstyle pairs, can't satisfy both
ignore = ["D203", "D212"]

[lint.pydocstyle]
convention = "google"
